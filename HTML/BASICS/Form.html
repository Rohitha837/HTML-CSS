<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="Enter your age" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>
        <br><br>

        <label>Gender:</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <br><br>

        <label>Skills:</label>

        <input type="checkbox" id="python" name="skill" value="python">
        <label for="python">Python</label>

        <input type="checkbox" id="html" name="skill" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skill" value="css">
        <label for="css">CSS</label>

        <br><br>

        <label for="course">Course:</label>

        <select id="course" required>
            <option value="">Select a course</option>
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="eee">EEE</option>
            <option value="mech">Mechanical</option>
        </select>

        <br><br>

        <label for="about">About Yourself:</label>
        <br>
        <textarea id="about" placeholder="Tell us about yourself"></textarea>

        <br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
