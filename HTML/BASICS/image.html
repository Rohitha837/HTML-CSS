<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
</head>
<body>
    <h1>Image Example</h1>
    <!-- adding an image in html -->
    <img src="C:\HTML-CSS\Images\i.jpg" alt="Description of the image" width="500" height="300"><br>
    <p>This is an example of an image in HTML.</p><br>
    <!-- image from the local directory -->
    <img src="photo.jpg" alt="My photo"><br>
    <p>This is another image.</p><br>
    <!-- image from the internet -->
    <img src="https://example.com/image.jpg" alt="Example image"><br>
    <p>This is an image from the internet.</p><br>
    <!-- image width and height -->
    <img src="photo.jpg" alt="My photo" width="300" height="200">
</body>
</html>
