<h1>HTML Attributes</h1>
<p>HTML attributes provide additional information about HTML elements. They are always specified in the opening tag
    of an element and usually come in name/value pairs like name="value".</p>
    <input type="text"><br>
    <a href="https://www.google.com">Google</a>   <br>  
    <img src="images/photo.jpg" alt="My photo"><br>
<img src="photo.jpg" alt="Student profile photo"><br>

</p>
