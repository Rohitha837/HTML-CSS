<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frames Example</title>
</head>
<frameset cols="40%,30%,30%" frameborder="0">
    <frame src="image.html" name="image" noresize>
    <frame src="paragraph.html" name="paragraph" noresize>
    <frame src="hyperlink.html" name="hyperlink" noresize>
    <noframes>
        <body>
            <h1>Frames Example</h1>
            <p>This is an example of using frames in HTML. The page is divided into three sections.</p>
            <p>Your browser does not support frames.</p>
        </body>
    </noframes>
</frameset>
</html>
