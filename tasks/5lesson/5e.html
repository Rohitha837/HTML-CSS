<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
p {
    font-family: Arial;
    text-align: center;
    margin-top: 0;
    margin-bottom: 0;
  }

  .p1 {
    color: rgb(245, 99, 0);
    margin-bottom: 10px;
  }

  .p2{
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 5px;
  }

  .p3 {
    font-size: 45px;
    font-weight: bold;
    margin-bottom: 15px;
  }

  .p4 {
    margin-bottom: 25px;
  }

button {
    background-color: rgb(0, 113, 227);
    color: white;
    padding-top: 7px;
    padding-bottom: 7px;
    padding-left: 15px;
    padding-right: 15px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
<body>
    <p class="p1">New</p>
    <p class="p2">MacBook Pro</p>
    <p class="p3">Supercharged for pros.</p>
    <p class="p4">From $1999</p>
    <button>Buy</button>
</body>
</html>
