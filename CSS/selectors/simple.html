<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple selector
    </title>
    <style>
        p{
            color: red;
            font-size: 20px;
        }
        #heading{
            color: blue;
            font-size: 30px;
        }
        .heading{
            color: green;
            font-size: 25px;
        }
        *{
            font-family: Arial, sans-serif;
        }
        h2,h1{
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Simple Selector</h1>
    <p>Hello Bro</p>
    <h2 id="heading">This is Id selector</h2>
    <h2 class="heading">This is class selector</h2>
    <p>This is a paragraph element.</p>

</body>
</html>
